global_costmap:
  global_frame: map  # 全局坐标系，通常使用地图坐标系
  robot_base_frame: base_link # 机器人底盘坐标系
  update_frequency: 1.0 # 更新频率，单位 Hz，全局代价地图更新频率较低，通常设置为 1 Hz 或更低
  publish_frequency: 1.0 # 发布频率，单位 Hz，
  static_map: true # 使用静态地图，通常全局代价地图使用静态地图作为基础
  rolling_window: false # 全局代价地图不使用滚动窗口，覆盖整个地图
  # 代价因子：实际使用的代价 = costmap代价 × cost_factor
  cost_factor: 5.0         
  lethal_cost: 253         
  neutral_cost: 66         
